# Local development and test infrastructure.
#
# No credentials are committed here. Every value comes from `.env` (git-ignored) via
# Compose's automatic env-file loading. `${VAR:?message}` makes Compose fail loudly
# when a required variable is unset instead of silently using a literal.
#
# Two database roles (docs/PHASE-0-IMPLEMENTATION.md §4):
#   POSTGRES_USER / POSTGRES_PASSWORD   migrator/owner — migrations and `npm run db:roles` only
#   APP_DB_USER / APP_DB_PASSWORD       restricted runtime role — the ONLY role web and worker use
#
#   docker compose up -d db          # application database
#   docker compose up -d test-db     # disposable integration-test database (tmpfs, wiped on stop)
#   docker compose --profile app up  # migrate (one-shot) -> proxy + web + worker (requires a build)
#
# Only `proxy` is published to the host (WEB_PORT, default 8080). `web` is deliberately NOT:
# see the note on that service and deploy/Caddyfile.
#
# Start order under --profile app: db healthy -> migrate runs to completion (migrations + runtime
# role grants, as the migrator) -> web and worker start. Web and worker therefore can never run
# against an unmigrated database or without their role, and never hold the migrator credentials.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-loyalty}
    # LOOPBACK ONLY. Host tooling (prisma migrate, psql, the seed) connects over this, but
    # "5433:5432" would bind 0.0.0.0 and publish the database to every interface of the host —
    # on a VPS that means the internet. Production can drop this mapping entirely: `web`,
    # `worker` and `migrate` reach the database over the Compose network, not through the host.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable database for integration tests. Data lives in RAM and is destroyed on `down`.
  # The test harness truncates all tables between test files; never point it at `db`.
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: loyalty_test
    # LOOPBACK ONLY, same reasoning as `db`. The integration suite runs on the host and needs
    # this; nothing else may reach it.
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5435}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d loyalty_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot migrator: `prisma migrate deploy` + `scripts/db-roles.mjs`, then exits 0.
  # The ONLY service that receives the migrator credentials.
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    environment:
      # Both passwords are interpolated into a URL and Compose substitutes them verbatim, with no
      # percent-encoding. Use URL-safe values (`openssl rand -hex 32`); a `/` in a password ends
      # the authority early and the connection string stops being a URL. See .env.example.
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (runtime role)}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Next.js standalone server. Opt-in via `--profile app`.
  web:
    profiles: ["app"]
    build:
      context: .
      target: web
    # `env_file: .env` was here and was wrong: it handed this container EVERY variable in the
    # file - the migrator password, both test-database URLs, and leftover prototype API keys -
    # while the comment below claimed the opposite. Each service now receives the variables it
    # needs by name. tests/unit/compose-exposure.test.ts fails if env_file returns.
    environment:
      NODE_ENV: production
      # Docker sets HOSTNAME to the container ID unless overridden, and the Next standalone
      # server does `const hostname = process.env.HOSTNAME || "0.0.0.0"`, so it would bind the
      # bridge address alone and refuse connections on the container's own loopback. Nothing here
      # probes loopback today - the proxy reaches `web:3000` by service name - but a healthcheck
      # added later must not rediscover the incident this cost a staging deployment.
      HOSTNAME: "0.0.0.0"
      # Inside the Compose network the database host is the service name, not localhost.
      # RUNTIME role only: web never holds the migrator credentials.
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (runtime role)}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (openssl rand -base64 48)}
      # Reach the stack through the proxy, not through the app: this is the published port.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${WEB_PORT:-8080}}
      # Forwarding headers may be believed HERE and only here, because `proxy` overwrites them
      # and this service is not published to the host. See deploy/Caddyfile.
      TRUST_PROXY_HEADERS: "true"
      # Webhook URL and signing-secret encryption (Phase 3B Prompt 2).
      #
      # `:-` and NOT `:?`, deliberately. An unset key must not stop the till: this product's
      # core - enrolment, stamps, points, redemptions, the scanner - does not touch webhooks,
      # and a deployment that configures none should start exactly as it did before the feature
      # existed. `${INTEGRATION_ENCRYPTION_KEY:-}` resolves to an empty string when the variable
      # is absent, which src/server/env.ts accepts (it is optional and deliberately unvalidated
      # there) and src/server/integrations/webhooks/crypto.ts treats the same as unset.
      #
      # So an absent or malformed value fails the WEBHOOK PATH closed - configuration and
      # delivery both refuse, by name, without ever printing the value - and touches nothing
      # else. There is no plaintext fallback.
      #
      # BOTH web and worker need the SAME value: web encrypts a destination's URL and secret
      # when the owner saves it, the worker decrypts them to sign and deliver. A stack where
      # only one of them has the key half-works, which is worse than neither having it.
      #
      # Given to these two services and to nothing else. `db`, `test-db`, `migrate` and `proxy`
      # have no use for it; tests/unit/compose-exposure.test.ts fails the gate if one of them
      # starts receiving it, or if `env_file` ever returns and hands it out wholesale.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
    # NOT published. The app is reachable only through `proxy` on the Compose network: a caller
    # who could reach port 3000 directly could forge X-Forwarded-For and walk past every
    # per-address rate limit.
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # pg-boss background worker. A SEPARATE process from web; it never runs inside a request.
  worker:
    profiles: ["app"]
    build:
      context: .
      target: worker
    # Same as `web`: named variables only, never the whole env file. See the note there.
    environment:
      NODE_ENV: production
      # RUNTIME role only. pg-boss owns the `pgboss` schema; it needs nothing in `public`.
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (runtime role)}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
      # The worker validates the same environment as web (src/server/env.ts), so the session
      # secret must be present even though the worker serves no session.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (openssl rand -base64 48)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${WEB_PORT:-8080}}
      WORKER_HEALTH_PORT: 8081
      # The delivery half of the pair. Same value as `web`, same optional-by-design `:-`, same
      # fail-closed behaviour when it is absent: the worker's other jobs run normally and only
      # webhook delivery refuses. See the note on `web`.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
    # NOT published: the health endpoint exists for the container orchestrator, which probes it
    # from inside (see healthcheck below). Publishing it would put an unauthenticated status
    # endpoint on the host for no benefit. To read it by hand:
    #   docker compose exec worker wget -qO- http://localhost:8081/health
    expose:
      - "8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The public entry point, and the reason the app may believe X-Forwarded-For at all: it
  # replaces that header with the address of the connection it received. Nothing else is
  # published to the host.
  proxy:
    profiles: ["app"]
    image: caddy:2-alpine
    restart: unless-stopped
    # THE ONLY PUBLIC BINDING IN THIS FILE. Everything else is either container-only (`web`,
    # `worker`, `migrate`) or bound to 127.0.0.1 for host tooling (`db`, `test-db`).
    # tests/unit/compose-exposure.test.ts fails the gate if that stops being true.
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
  caddy-data:
  caddy-config:
