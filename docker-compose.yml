# Local development and test infrastructure.
#
# No credentials are committed here. Every value comes from `.env` (git-ignored) via
# Compose's automatic env-file loading. `${VAR:?message}` makes Compose fail loudly
# when a required variable is unset instead of silently using a literal.
#
# Two database roles (docs/PHASE-0-IMPLEMENTATION.md §4):
#   POSTGRES_USER / POSTGRES_PASSWORD   migrator/owner — migrations and `npm run db:roles` only
#   APP_DB_USER / APP_DB_PASSWORD       restricted runtime role — the ONLY role web and worker use
#
#   docker compose up -d db          # application database
#   docker compose up -d test-db     # disposable integration-test database (tmpfs, wiped on stop)
#   docker compose --profile app up  # migrate (one-shot) -> web + worker containers (requires a build)
#
# Start order under --profile app: db healthy -> migrate runs to completion (migrations + runtime
# role grants, as the migrator) -> web and worker start. Web and worker therefore can never run
# against an unmigrated database or without their role, and never hold the migrator credentials.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-loyalty}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable database for integration tests. Data lives in RAM and is destroyed on `down`.
  # The test harness truncates all tables between test files; never point it at `db`.
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: loyalty_test
    ports:
      - "${TEST_POSTGRES_PORT:-5435}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d loyalty_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot migrator: `prisma migrate deploy` + `scripts/db-roles.mjs`, then exits 0.
  # The ONLY service that receives the migrator credentials.
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    environment:
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (runtime role)}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Next.js standalone server. Opt-in via `--profile app`.
  web:
    profiles: ["app"]
    build:
      context: .
      target: web
    env_file: .env
    environment:
      # Inside the Compose network the database host is the service name, not localhost.
      # RUNTIME role only: web never holds the migrator credentials.
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (runtime role)}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # pg-boss background worker. A SEPARATE process from web; it never runs inside a request.
  worker:
    profiles: ["app"]
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      # RUNTIME role only. pg-boss owns the `pgboss` schema; it needs nothing in `public`.
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (runtime role)}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
      WORKER_HEALTH_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
