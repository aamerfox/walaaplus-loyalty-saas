# STAGING deployment. Self-contained: use this file ALONE, never merged with docker-compose.yml.
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# It is a separate file rather than an overlay on the local stack for two reasons, both of which
# were tried first and rejected:
#
#   - Compose APPENDS the `ports` of an overlay to the base service's. There is no syntax for
#     removing a published port. The base publishes PostgreSQL on 127.0.0.1 so host tooling can
#     reach it; an overlay could never take that back, and a staging file that cannot remove a
#     database binding is not a staging file.
#   - The base stack also defines `test-db`, a throwaway database holding the migrator
#     credentials with its data in tmpfs. Nothing like it belongs on a server facing the internet.
#
# The full runbook — DNS, secrets, migration order, backups, rollback, certificate renewal — is
# docs/STAGING-RUNBOOK.md. Read it before running this.
#
# WHAT IS PUBLIC: `proxy`, on 80 and 443, and nothing else. Every other service is reachable only
# from inside the Compose networks. tests/unit/compose-exposure.test.ts fails the gate if that
# stops being true of this file.
#
# WHAT CAN LEAVE (Phase 3B Prompt 3): `proxy`, for ACME, and `webhook-egress`, for webhook
# delivery. Nothing else. `worker` stays on internal networks only - it holds the encryption key
# and every decrypted destination URL and signing secret, and it reaches the gateway over
# `webhook-control`, which has no route out. See docs/WEBHOOK-EGRESS-TOPOLOGY.md.
#
# WHAT HOLDS WHICH CREDENTIAL:
#   migrate  MIGRATE_DATABASE_URL (owner role) - the only service that ever receives it
#   web      DATABASE_URL (restricted runtime role), the session secret, and the webhook
#            encryption key
#   worker   DATABASE_URL (restricted runtime role) and the webhook encryption key
# INTEGRATION_ENCRYPTION_KEY goes to web and worker and to NOTHING else - not db, not migrate,
# not proxy - and it is optional at interpolation time, so an environment that configures no
# webhooks starts unchanged. See the note on `web`.
# `env_file` is deliberately not used for web and worker. It would hand those containers every
# variable in the file, migrator password included, to save typing one line. Each service below
# receives the variables it needs and no others.

name: walaaplus-staging

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-loyalty}
    # NO `ports`. Not even a loopback binding: nothing on this host needs to reach PostgreSQL
    # through the host's network stack. Migrations, the app and the worker all reach it over the
    # `backend` network by service name, and a backup runs INSIDE the container
    # (`docker compose exec db pg_dump`). A published port here would be the single most likely
    # way this deployment gets breached.
    networks: [backend]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: `prisma migrate deploy` then `scripts/db-roles.mjs`, then exits 0. web and worker
  # wait for it to COMPLETE, so they can never run against an unmigrated schema or without their
  # grants. Bringing the stack up again re-runs it; both steps are idempotent.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      # BOTH database passwords are interpolated into a URL here, so both must be URL-safe.
      # Compose cannot percent-encode: it substitutes the value verbatim. A password containing
      # `/` ends the authority early and the string stops being a URL, which is why
      # .env.staging.example generates these with `openssl rand -hex 32` rather than base64.
      # src/server/env.ts and scripts/db-roles.mjs both refuse a connection string that does not
      # parse, naming the variable and never printing the value.
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
      # db-roles.mjs reads the runtime role's NAME and PASSWORD from this URL and creates the
      # role from them. It is the one place a runtime credential is written down.
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.staging}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Docker sets HOSTNAME to the container ID unless it is overridden, and the Next
      # standalone server does `const hostname = process.env.HOSTNAME || "0.0.0.0"`. So it binds
      # the container's bridge address only, and 127.0.0.1 inside the container refuses
      # connections - which is exactly how the healthcheck below failed on a real deployment
      # while the same endpoint answered fine through the published port from the host.
      # Setting it to 0.0.0.0 restores the server's own default: listen on every interface,
      # including loopback. This publishes nothing new: what a container listens on internally is
      # not what the host exposes, and the `ports`/`expose` lines below are unchanged.
      HOSTNAME: "0.0.0.0"
      # RUNTIME role only. This container never receives POSTGRES_PASSWORD.
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.staging}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.staging - generate with openssl rand -base64 48}
      NEXTAUTH_URL: https://${WALAAPLUS_DOMAIN:?Set WALAAPLUS_DOMAIN in .env.staging}
      # Forwarding headers may be believed HERE and only here: `proxy` REPLACES them with the
      # address of the connection it received, and this service publishes no port, so no request
      # can reach it without passing through that replacement. See deploy/Caddyfile.staging.
      TRUST_PROXY_HEADERS: "true"
      # Webhook URL and signing-secret encryption. Per-environment: staging and production must
      # not share a value, and neither may ever be committed, logged or rendered.
      #
      # `:-` and NOT `:?`: an unset key must not stop the application. It resolves to an empty
      # string, src/server/env.ts accepts that (optional, deliberately unvalidated there), and
      # src/server/integrations/webhooks/crypto.ts then fails the webhook path closed - webhook
      # configuration and delivery refuse, everything else runs untouched. No plaintext fallback.
      #
      # web and worker need the SAME 32-byte value: web encrypts a destination when it is saved,
      # the worker decrypts it to sign and deliver. Named in .env.staging.example, with no value.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
    # Container-only. A caller who could reach port 3000 directly would forge X-Forwarded-For and
    # walk past every per-address rate limit in the product.
    expose:
      - "3000"
    networks: [backend, edge]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER:-walaaplus_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.staging}@db:5432/${POSTGRES_DB:-loyalty}?schema=public
      # The worker validates the same environment as web (src/server/env.ts), so the session
      # secret must be present even though the worker serves no session.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.staging}
      NEXTAUTH_URL: https://${WALAAPLUS_DOMAIN:?Set WALAAPLUS_DOMAIN in .env.staging}
      # Shared secret authenticating this worker to the egress gateway.
      #
      # A DIFFERENT secret from INTEGRATION_ENCRYPTION_KEY and never derived from it: that one
      # protects destination URLs and signing secrets at rest, this one authenticates a caller on
      # one internal hop. One value doing both would mean recovering it from either place hands
      # over the other capability too.
      #
      # `:-` and NOT `:?`, for the same reason as the encryption key: an unset optional secret
      # must not stop the till. Absent or malformed, webhook delivery records GATEWAY_UNAVAILABLE,
      # retries within the normal cap and SENDS NOTHING. Every other workflow is untouched.
      WEBHOOK_GATEWAY_SECRET: ${WEBHOOK_GATEWAY_SECRET:-}
      # Not a secret: a service name and a port on an internal network. Only the scheme, host and
      # port are used - the request path is a compile-time constant in src/.../gateway.ts - so this
      # cannot be made to fetch an arbitrary path on a host of someone else's choosing.
      WEBHOOK_GATEWAY_URL: ${WEBHOOK_GATEWAY_URL:-http://webhook-egress:8082}
      WORKER_HEALTH_PORT: 8081
      # The delivery half of the pair; same value as `web`. See the note there.
      #
      # The key lets the worker DECRYPT a destination; it is not what lets it REACH one. This
      # service still has no route to the Internet, and that is now correct rather than broken:
      # since Prompt 3 the request is made by `webhook-egress`, which the worker reaches over
      # `webhook-control`. If that service is down, delivery is GATEWAY_UNAVAILABLE and retries.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
    # Container-only, and on the internal network only: an unauthenticated status endpoint has no
    # reason to be reachable from the host. Read it by hand with
    #   docker compose -f docker-compose.staging.yml exec worker wget -qO- http://localhost:8081/health
    expose:
      - "8081"
    # Two internal networks and no routable one. `backend` reaches the database; `webhook-control`
    # reaches the egress gateway. Neither has a gateway of its own, so this container has no path
    # to any external host however it is asked for one.
    networks: [backend, webhook-control]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      webhook-egress:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Webhook egress gateway. THE ONLY SERVICE IN THIS FILE WITH A ROUTE TO THE INTERNET.
  #
  # It exists so that the process holding the secrets is not the process holding the route. The
  # worker keeps DATABASE_URL, the encryption key, every decrypted destination URL and every
  # decrypted signing secret, and has no way out; this service can reach a merchant endpoint and
  # holds none of those things - no database credential, no encryption key, no signing secret, no
  # session secret. Its image carries no node_modules, no Prisma client and no PostgreSQL driver.
  #
  # It is NOT a proxy. It accepts POST /dispatch, one JSON object with exactly three keys, five
  # allow-listed headers, https:// on port 443 only, and it builds its own outbound request from
  # the parts it accepted. CONNECT and Upgrade destroy the socket; an absolute-form request target
  # is a 400. It answers with a status code and a bounded classification and never with the
  # receiver's body. See docs/WEBHOOK-EGRESS-TOPOLOGY.md.
  #
  # NO PUBLISHED PORT, in any variant. The only thing that can reach it is `worker`, over
  # `webhook-control`, which is `internal: true`. Nothing on the host, in another Compose project
  # or on a neighbour's stack has a path to it.
  #
  # No healthcheck, deliberately: the only thing it answers is the dispatch contract, and adding a
  # second route for a prober would widen the contract to make the container look tidier. If it is
  # down, delivery records GATEWAY_UNAVAILABLE, retries, and loses nothing.
  webhook-egress:
    build:
      context: .
      target: egress
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The same value the worker has. Optional here too: with no secret this service still starts
      # and answers SECRET_UNAVAILABLE to every dispatch, which is fail-closed - nothing is sent -
      # rather than crash-looping a container. It receives NO other secret: no DATABASE_URL, no
      # NEXTAUTH_SECRET and, deliberately, no INTEGRATION_ENCRYPTION_KEY, because it decrypts
      # nothing.
      WEBHOOK_GATEWAY_SECRET: ${WEBHOOK_GATEWAY_SECRET:-}
      WEBHOOK_EGRESS_PORT: 8082
    expose:
      - "8082"
    networks: [webhook-control, webhook-egress-out]

  # THE ONLY PUBLIC SERVICE. Terminates TLS, obtains and renews the certificate over ACME, and
  # rewrites the forwarding headers the app is allowed to believe.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WALAAPLUS_DOMAIN: ${WALAAPLUS_DOMAIN:?Set WALAAPLUS_DOMAIN in .env.staging, e.g. staging.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.staging - the address Let's Encrypt notifies before expiry}
    # Both are required and neither is optional: 443 serves the site, 80 answers the HTTP-01
    # challenge and redirects human traffic to HTTPS.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      # THE CERTIFICATE AND ITS PRIVATE KEY LIVE HERE. Back this volume up, or at minimum never
      # delete it casually: re-issuing counts against Let's Encrypt's rate limit for the name.
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  # `internal: true` removes this network's gateway. Containers attached only to it - db, worker,
  # migrate - have no route to the internet AT ALL, in either direction. It is the difference
  # between "we did not publish the port" and "there is no path".
  backend:
    internal: true
  # The proxy needs outbound access for ACME, and `web` is attached so the proxy can reach it.
  edge:
  # worker <-> webhook-egress, and nothing else is attached. Internal, so the worker gains a
  # neighbour and not a route: this is what lets the process holding the secrets stay unable to
  # reach anything outside Docker.
  webhook-control:
    internal: true
  # The one routable network added by Prompt 3. `webhook-egress` is its only member - not db, not
  # migrate, not web, not worker, not proxy - so the whole of the new outbound capability is this
  # network and that one service.
  webhook-egress-out:

volumes:
  db-data:
  caddy-data:
  caddy-config:
